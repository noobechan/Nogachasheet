name: Update Korean stage names

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build Korean stage database
        run: python scripts/update_stage_ko.py

      - name: Show coverage
        run: |
          python - <<'PY'
          import json

          d = json.load(
              open(
                  "stage-ko.json",
                  encoding="utf-8"
              )
          )

          print(
              "coverage:",
              d.get("sheet_translated_count"),
              "/",
              d.get("sheet_stage_count")
          )

          print(
              "untranslated:",
              d.get("untranslated_count")
          )

          for x in d.get(
              "untranslated",
              []
          ):
              print(" -", x)
          PY

      - name: Commit generated stage-ko.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stage-ko.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Korean stage names"
            git push
          fi

      - name: Upload stage-ko.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-ko-json
          path: stage-ko.json

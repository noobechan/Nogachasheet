name: Update Korean stage names

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build Korean stage database
        run: python scripts/update_stage_ko.py

      - name: Verify complete ranking-sheet coverage
        run: |
          python - <<'PY'
          import json
          import sys

          with open("stage-ko.json", encoding="utf-8") as f:
              d = json.load(f)

          missing = d.get("untranslated", [])

          print(
              "coverage:",
              d.get("sheet_translated_count"),
              "/",
              d.get("sheet_stage_count")
          )

          if missing:
              print("untranslated:", len(missing))
              print("\n".join(missing))
              sys.exit(1)
          PY

      - name: Commit stage-ko.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stage-ko.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Korean stage names"
            git push
          fi

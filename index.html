<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무과금 편성 수록 랭킹</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
:root{color-scheme:light dark;--font-kr:'Jua',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-jp:'Zen Maru Gothic','Hiragino Sans','Yu Gothic',sans-serif;--bg:#f4f6f8;--card:#fff;--line:#d8dde5;--text:#1b1f24;--muted:#657080;--accent:#3568d4;--accent-soft:#eaf0ff;--shadow:0 18px 50px rgba(20,28,45,.08);--surface:#fafbfc}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(900px 420px at 50% -120px,rgba(53,104,212,.12),transparent 62%),linear-gradient(180deg,#f7f9fc 0%,var(--bg) 46%,#eef2f7 100%);background-attachment:fixed;color:var(--text);font-family:var(--font-kr);text-shadow:.08px 0 0 currentColor;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:32px 16px 48px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}.title h1{font-size:clamp(20px,3vw,30px);line-height:1.25;letter-spacing:-.025em;margin:0 0 5px;font-weight:500}.sub{color:var(--muted);font-size:13px}.refresh{font-family:var(--font-kr);border:1px solid var(--line);background:#eef1f5;color:var(--text);border-radius:12px;padding:10px 13px;font-weight:500;cursor:pointer;box-shadow:0 6px 18px rgba(20,28,45,.06);transition:.16s ease}.refresh:hover{transform:translateY(-1px);border-color:#aeb7c4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}.stat,.tablebox,.unknown{background:linear-gradient(180deg,#fff,#fbfcfe);border:1px solid #dce3ed;border-radius:18px;box-shadow:var(--shadow)}.stat{padding:14px 16px}.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:22px;display:block;margin-top:4px;font-weight:500}.status{font-size:12px;color:var(--muted);margin:0 2px 10px}.error{display:none;background:#fff0f0;color:#b42318;border:1px solid #f5b8b8;padding:13px 15px;border-radius:14px;line-height:1.55;margin:12px 0}.tablebox{overflow:hidden}.table-head{height:58px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#fff,#fbfcff)}.table-head h2{margin:0;font-size:16px;letter-spacing:-.018em}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 14px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px;white-space:nowrap}th{font-size:12px;color:#526074;background:#f5f8fc;position:sticky;top:0;z-index:2}tbody tr:hover td{background:rgba(53,104,212,.025)}tbody tr:last-child td{border-bottom:0}.rank{width:72px;text-align:center}.count{text-align:right;font-weight:500;width:85px}.player{font-weight:400}.kr-row .rank{color:#3568d4}.medal{font-size:21px;line-height:1;display:inline-block;vertical-align:-2px}.search{width:min(280px,42vw);border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:9px 11px;font-family:var(--font-kr);font-size:13px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(53,104,212,.11)}.details{color:var(--muted);font-size:11.5px;margin-top:4px}.unknown{margin-top:16px;padding:13px 15px;color:#555f6d;font-size:12px;line-height:1.6;position:relative;overflow:hidden}.unknown:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,rgba(53,104,212,.70),rgba(53,104,212,.18))}.unknown b{color:var(--text)}.footer{text-align:center;color:#7b8491;font-size:12px;line-height:1.5;margin-top:18px}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f25;--line:#343b45;--text:#f1f4f7;--muted:#a7b0bd;--accent:#79a6ff;--accent-soft:#1d2d4b;--shadow:0 18px 50px rgba(0,0,0,.28);--surface:#20262d}body{background:radial-gradient(900px 420px at 50% -120px,rgba(63,114,215,.18),transparent 62%),linear-gradient(180deg,#11161c 0%,var(--bg) 48%,#0e1217 100%)}.refresh{background:#303740;color:#cbd2db;border-color:#343b45}.stat,.tablebox,.unknown{background:linear-gradient(180deg,rgba(31,37,45,.96),rgba(24,29,35,.97));border-color:rgba(124,141,161,.18)}.table-head{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);border-color:var(--line)}th{background:#222830;color:#c6ced8}td{border-bottom-color:#2b323a}tbody tr:hover td{background:rgba(121,166,255,.025)}.unknown{color:#b6bfca}.error{background:#2b1d1d;color:#ff9a93;border-color:#6b4442}}
.actions{display:flex;gap:8px;align-items:center}@media(prefers-color-scheme:dark){.search{background:#151a20;border-color:#343b45}.kr-row .rank{color:#79a6ff}}
@media(max-width:700px){.wrap{padding:22px 10px 30px}.topbar{flex-direction:column;gap:12px}.actions{width:100%}.search{width:100%;flex:1}.refresh{align-self:flex-start}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:12px}.tablebox{border-radius:15px}.table-head{height:55px;padding:0 15px}th,td{padding:10px 9px}.rank{width:50px}.details{font-size:10.8px}}
</style></head>
<body><main class="wrap">
<div class="topbar"><div class="title"><h1 id="pageTitle">무과금 편성 수록 랭킹</h1><div class="sub" id="pageSub">無課金枠縛り Google Sheets 기준 · 플레이어명 표기 1칸 = 1건</div></div><div class="actions"><input class="search" id="search" type="search" placeholder="유저 검색" autocomplete="off"><button class="refresh" id="refresh">↻ 새로고침</button></div></div>
<div class="stats"><div class="stat"><span id="labPlayers">순위 플레이어</span><b id="players">-</b></div><div class="stat"><span id="labRecords">전체 수록</span><b id="records">-</b></div><div class="stat"><span id="labKrRecords">한국인 수록</span><b id="krRecords">-</b></div><div class="stat"><span id="labUnknown">불명</span><b id="unknown">-</b></div></div>
<div class="status" id="status">최신 시트 데이터를 불러오는 중…</div><div class="error" id="error"></div>
<div class="tablebox"><div class="table-head"><h2 id="rankTitle">전체 랭킹</h2></div><div class="table-wrap"><table><thead><tr><th class="rank" id="thRank">순위</th><th id="thPlayer">플레이어</th><th class="count" id="thCount">수록</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="unknown"><span id="unknownText">불명 기록은 순위에서 제외합니다. 현재 불명 총합:</span> <b id="unknownBottom">-</b></div>
<div class="footer" id="footerText">이 페이지는 Google Sheets 데이터를 브라우저에서 직접 읽어 순위를 계산합니다. 시트 수정 후 Google 측 데이터 반영에 약간의 지연이 생길 수 있습니다. 데이터가 갱신되지 않으면 ‘새로고침’을 눌러 주세요.</div>
</main>
<script>
const SHEET_ID='12bhVk1tfC9N-U2eU9xie-XoW2gw85acQAukR-W2k3KY';
const CATEGORIES={
 '旧レ':'구레','真レ':'신레','零レ':'제로레','塔':'탑','降臨':'강림','強襲':'강습','超獣':'초수','開眼':'개안','コラボ':'콜라보','他':'기타'
};
const TEXT={loading:'최신 시트 데이터를 불러오는 중…',last:'마지막 갱신: ',fail:'데이터 연결 실패',err:'시트 데이터를 직접 읽지 못했습니다.'};
const KOREANS=new Set(['퓨츄','싱싱한뉴비','black rabbit','ノノ','sour','푸하하','hmmm','윾띵','프츠','light','인사','포적']);
// 사용자가 확정한 동일인/표기 통합 규칙. 필요하면 여기에 계속 추가 가능.
const ALIASES=new Map([
 ['brack rabbit','black rabbit'],
 ['black rabbit','black rabbit'],
 ['被神眷顾的小初','被神眷顧的小初']
]);
const DISPLAY=new Map([['black rabbit','Black Rabbit'],['sour','기플'],['hmmm','Hmmm']]);
let dataset=[];
function normName(raw){
 let s=String(raw??'').trim(); if(!s)return '';
 // 영어 대소문자 통합. 한글/일본어/중국어에는 영향 없음.
 let key=s.toLocaleLowerCase('en-US');
 if(/^noname(?:\b|[\d._-])/i.test(s)||/^deleted\d*$/i.test(s)||s==='不明') return '__unknown__';
 if(ALIASES.has(key)) key=ALIASES.get(key);
 if(ALIASES.has(s)) key=ALIASES.get(s);
 return key;
}
function displayName(key,raw){return DISPLAY.get(key)||raw}
function parseCSV(text){let out=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else{if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v.replace(/\r$/,''));out.push(row);row=[];v=''}else v+=c}}if(v||row.length){row.push(v);out.push(row)}return out}
async function loadTab(tab){
 const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
 const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw new Error(`${tab}: HTTP ${r.status}`);
 const rows=parseCSV(await r.text()); if(!rows.length)return [];
 const headers=rows[0].map(x=>x.trim()); const playerCols=[];
 headers.forEach((h,i)=>{if(h==='プレイヤー')playerCols.push(i)});
 if(!playerCols.length)throw new Error(`${tab}: プレイヤー 열을 찾지 못했습니다.`);
 let items=[]; for(let y=1;y<rows.length;y++)for(const x of playerCols){const raw=(rows[y][x]||'').trim();if(raw)items.push({raw,tab,row:y+1})}
 return items;
}
async function load(){
 const status=document.querySelector('#status'),err=document.querySelector('#error'); err.style.display='none'; status.textContent=TEXT.loading;
 try{
  const chunks=await Promise.all(Object.keys(CATEGORIES).map(loadTab)); const all=chunks.flat();
  const map=new Map(); let unknown=0;
  for(const item of all){const key=normName(item.raw);if(!key)continue;if(key==='__unknown__'){unknown++;continue}
   if(!map.has(key))map.set(key,{key,name:displayName(key,item.raw),count:0,cats:{},raws:new Set()});
   const p=map.get(key);p.count++;p.cats[item.tab]=(p.cats[item.tab]||0)+1;p.raws.add(item.raw);
  }
  dataset=[...map.values()].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
  window.__unknown=unknown; render();
  status.textContent=TEXT.last+new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'medium'}).format(new Date());
 }catch(e){console.error(e);err.style.display='block';err.innerHTML=`${TEXT.err}<br><b>${String(e.message||e)}</b><br>현재 Google 공유 설정에서 브라우저 직접 접근이 차단된 경우 Apps Script 방식으로 전환해야 합니다.`;status.textContent=TEXT.fail;}
}
function isKorean(p){return KOREANS.has(p.key)||KOREANS.has(p.name)}
function render(){
 const q=(document.querySelector('#search').value||'').trim().toLocaleLowerCase();
 let list=q?dataset.filter(p=>p.name.toLocaleLowerCase().includes(q)||[...p.raws].some(x=>x.toLocaleLowerCase().includes(q))):dataset;
 const overallRank=new Map();let prev=null,rank=0;
 dataset.forEach((p,i)=>{if(p.count!==prev)rank=i+1;prev=p.count;overallRank.set(p.key,rank)});
 const tbody=document.querySelector('#rows');tbody.innerHTML='';
 list.forEach(p=>{const r=overallRank.get(p.key);const cat=Object.entries(p.cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${CATEGORIES[k]} ${v}`).join(' · ');
  const tr=document.createElement('tr');if(isKorean(p))tr.classList.add('kr-row');
  const rankHtml=r===1?'<span class="medal" title="1위">🥇</span>':r===2?'<span class="medal" title="2위">🥈</span>':r===3?'<span class="medal" title="3위">🥉</span>':String(r);
  tr.innerHTML=`<td class="rank">${rankHtml}</td><td><span class="player"></span><div class="details"></div></td><td class="count">${p.count}</td>`;
  tr.querySelector('.player').textContent=p.name;tr.querySelector('.details').textContent=cat;tbody.appendChild(tr)
 });
 const krTotal=dataset.filter(isKorean).reduce((s,p)=>s+p.count,0), allTotal=dataset.reduce((s,p)=>s+p.count,0)+(window.__unknown||0);
 document.querySelector('#players').textContent=dataset.length.toLocaleString();document.querySelector('#records').textContent=allTotal.toLocaleString();document.querySelector('#krRecords').textContent=krTotal.toLocaleString();document.querySelector('#unknown').textContent=(window.__unknown||0).toLocaleString();document.querySelector('#unknownBottom').textContent=(window.__unknown||0).toLocaleString()+'건';
}
document.querySelector('#search').addEventListener('input',render);
document.querySelector('#refresh').onclick=load;
load(); setInterval(load,60000);
</script></body></html>

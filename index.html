<style>

r-gradient(180deg,rgba(53,104,212,.70),rgba(53,104,212,.18))}.unknown b{color:var(--text)}.footer{text-align:center;color:#7b8491;font-size:12px;line-height:1.5;margin-top:18px}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f25;--line:#343b45;--text:#f1f4f7;--muted:#a7b0bd;--accent:#79a6ff;--accent-soft:#1d2d4b;--shadow:0 18px 50px rgba(0,0,0,.28);--surface:#20262d}body{background:radial-gradient(900px 420px at 50% -120px,rgba(63,114,215,.18),transparent 62%),linear-gradient(180deg,#11161c 0%,var(--bg) 48%,#0e1217 100%)}.refresh{background:#303740;color:#cbd2db;border-color:#343b45}.tablebox,.unknown{background:linear-gradient(180deg,rgba(31,37,45,.96),rgba(24,29,35,.97));border-color:rgba(124,141,161,.18)}.table-head{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);border-color:var(--line)}th{background:#222830;color:#c6ced8}td{border-bottom-color:#2b323a}tbody tr:hover td{background:rgba(121,166,255,.025)}.unknown{color:#b6bfca}.error{background:#2b1d1d;color:#ff9a93;border-color:#6b4442}}
.actions{display:flex;gap:8px;align-items:center}@media(prefers-color-scheme:dark){.search{background:#151a20;border-color:#343b45}.kr-row .rank{color:#79a6ff}.kr-badge{background:rgba(121,166,255,.12);border-color:rgba(121,166,255,.22);color:#9bbcff}}
@media(max-width:700px){.wrap{padding:22px 10px 30px}.title{padding-left:5px}.topbar{flex-direction:column;gap:12px}.actions{width:100%}.search{width:100%;flex:1}.refresh{align-self:flex-start}.tablebox{border-radius:15px}.table-head{height:55px;padding:0 15px}th,td{padding:10px 9px}.rank{width:50px}.details{font-size:10.8px}}

.player{cursor:pointer}.player:hover{color:var(--accent)}.info-btn{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:7px;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);font-family:Arial,sans-serif;font-size:12px;font-weight:700;line-height:1;cursor:pointer;vertical-align:-2px}.info-btn:hover{color:var(--accent);border-color:var(--accent)}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,15,22,.46);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-backdrop.open{display:flex}.modal{width:min(820px,100%);max-height:min(82vh,760px);overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.25);display:flex;flex-direction:column}.modal-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal-title{margin:0;font-size:20px}.modal-meta{margin-top:4px;color:var(--muted);font-size:12px}.modal-close{width:36px;height:36px;padding:0;border-radius:10px;font-size:20px;line-height:1}.modal-body{overflow:auto;padding:14px}.post-list{display:grid;gap:10px}.post{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-soft)}.post-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.post-stage{font-size:14px;font-weight:500;line-height:1.45}.post-cat{font-size:10px;padding:3px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}.post-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:11px}.post-link{color:var(--accent);text-decoration:none}.post-link:hover{text-decoration:underline}.post-link.disabled{color:var(--muted);pointer-events:none;opacity:.7}@media(max-width:620px){.modal-backdrop{padding:10px}.modal{max-height:88vh;border-radius:16px}.modal-head{padding:15px}.modal-body{padding:10px}.post{padding:11px 12px}.post-bottom{align-items:flex-end}}

  transform: translate(-2px,-1px) scale(.90);

<script>
const ADMIN_API_URL=""; // apps-script/Code.gs 배포 후 /exec URL 입력 (원본 Google Sheet는 수정하지 않음)
let ADMIN_MODE=false, ADMIN_PASSWORD_SESSION="";

let WEB_OVERRIDES={};
function overrideKey(x){return `${x.tab}|${x.row}|${x.stageCol}|${x.urlCol}`}
async function loadWebOverrides(){
 if(!ADMIN_API_URL){WEB_OVERRIDES={};return}
 try{
  const r=await fetch(ADMIN_API_URL+"?action=overrides&_="+Date.now(),{cache:"no-store"});
  const j=await r.json();
  WEB_OVERRIDES=(j&&j.ok&&j.overrides)||{};
 }catch(e){console.warn("웹 관리자 override 로드 실패",e);WEB_OVERRIDES={}}
}
function applyWebOverride(x){
 const o=WEB_OVERRIDES[overrideKey(x)];
 if(!o)return x;
 return {...x,
   stage:Object.prototype.hasOwnProperty.call(o,"stage")?String(o.stage??""):x.stage,
   url:Object.prototype.hasOwnProperty.call(o,"url")?String(o.url??""):x.url
 };
}


function setAdminMode(v){
 ADMIN_MODE=!!v;
 document.documentElement.classList.toggle("admin-on",ADMIN_MODE);
 const b=document.querySelector("#adminModeBtn");
 if(b)b.textContent=ADMIN_MODE?"관리자 모드 종료":"관리자 모드";
}
async function adminRequest(data){
 if(!ADMIN_API_URL)throw new Error("관리자 API URL이 아직 설정되지 않았습니다.");
 const r=await fetch(ADMIN_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
  body:JSON.stringify({...data,password:ADMIN_PASSWORD_SESSION})});
 const j=await r.json();
 if(!j.ok)throw new Error(j.error||"관리자 작업에 실패했습니다.");
 return j;
}
async function adminLogin(){
 const pw=document.querySelector("#adminPassword").value;
 const msg=document.querySelector("#adminLoginMsg");
 if(!pw){msg.textContent="비밀번호를 입력하세요.";return}
 try{
   if(ADMIN_API_URL){
     const r=await fetch(ADMIN_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"login",password:pw})});
     const j=await r.json();if(!j.ok)throw new Error(j.error||"비밀번호가 올바르지 않습니다.");
   }else if(pw!=="samettav21"){throw new Error("비밀번호가 올바르지 않습니다.");}
   ADMIN_PASSWORD_SESSION=pw;setAdminMode(true);closeAdminLogin();render();
 }catch(e){msg.textContent=e.message}
}
function openAdminLogin(){
 if(ADMIN_MODE){ADMIN_PASSWORD_SESSION="";setAdminMode(false);render();return}
 const m=document.querySelector("#adminLogin");m.classList.add("open");m.setAttribute("aria-hidden","false");
 document.querySelector("#adminPassword").value="";document.querySelector("#adminLoginMsg").textContent="";
 setTimeout(()=>document.querySelector("#adminPassword").focus(),30);
}
function closeAdminLogin(){const m=document.querySelector("#adminLogin");m.classList.remove("open");m.setAttribute("aria-hidden","true")}
async function adminSave(btn,x){
 const box=btn.closest(".admin-tools"),msg=box.querySelector(".admin-msg");
 const stage=box.querySelector(".admin-stage").value;
 const url=box.querySelector(".admin-url").value;
 msg.textContent="저장 중…";
 try{
  await adminRequest({action:"setOverride",key:overrideKey(x),stage,url});
  WEB_OVERRIDES[overrideKey(x)]={stage,url};
  msg.textContent="저장했습니다.";setTimeout(()=>load(),250);
 }catch(e){msg.textContent=e.message}
}
async function adminDeleteLink(btn,x){
 const box=btn.closest(".admin-tools"),msg=box.querySelector(".admin-msg");
 if(!confirm("게시물 링크를 삭제할까요?"))return;
 msg.textContent="삭제 중…";
 try{
  const stage=box.querySelector(".admin-stage").value;
  await adminRequest({action:"setOverride",key:overrideKey(x),stage,url:""});
  WEB_OVERRIDES[overrideKey(x)]={stage,url:""};
  msg.textContent="삭제했습니다.";setTimeout(()=>load(),250);
 }catch(e){msg.textContent=e.message}
}
</script>

<div class="status" id="status">최신 시트 데이터를 불러오는 중…</div><div class="error" id="error"></div>
<div class="tablebox"><div class="table-head"><h2 id="rankTitle">전체 랭킹</h2></div><div class="table-wrap"><table><thead><tr><th class="rank" id="thRank">순위</th><th id="thPlayer">플레이어</th><th class="count" id="thCount">수록</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="unknown"><span id="unknownText">불명 기록은 순위에서 제외합니다. 현재 불명 총합:</span> <b id="unknownBottom">-</b></div>
<div class="footer" id="footerText">이 페이지는 Google Sheets 데이터를 브라우저에서 직접 읽어 순위를 계산합니다. 시트 수정 후 Google 측 데이터 반영에 약간의 지연이 생길 수 있습니다. 데이터가 갱신되지 않으면 ‘새로고침’을 눌러 주세요.</div>
</main>

<div class="modal-backdrop" id="playerModal" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h3 class="modal-title" id="modalTitle"></h3><div class="modal-meta" id="modalMeta"></div></div><button class="modal-close" id="modalClose" aria-label="닫기">×</button></div><div class="modal-body"><div class="post-list" id="postList"></div></div></section></div>
<script>
const SHEET_ID='12bhVk1tfC9N-U2eU9xie-XoW2gw85acQAukR-W2k3KY';
const CATEGORIES_KR={'旧レ':'구레','真レ':'신레','零レ':'레제로','塔':'탑','降臨':'강림','強襲':'강습','超獣':'초수','開眼':'각성','コラボ':'콜라보','他':'기타'};
const UI={title:'무과금 편성 수록 랭킹',sub:'Google Sheets 기준 · 플레이어명 표기 1칸 = 1건',search:'유저 검색',refresh:'↻ 새로고침',rankTitle:'전체 랭킹',rank:'순위',player:'플레이어',count:'수록',loading:'최신 시트 데이터를 불러오는 중…',last:'마지막 갱신: ',fail:'데이터 연결 실패',err:'시트 데이터를 직접 읽지 못했습니다.',unknown:'불명 기록은 순위에서 제외합니다. 현재 불명 총합:',footer:'이 페이지는 Google Sheets 데이터를 브라우저에서 직접 읽어 순위를 계산합니다. 시트 수정 후 Google 측 데이터 반영에 약간의 지연이 생길 수 있습니다. 데이터가 갱신되지 않으면 ‘새로고침’을 눌러 주세요.',meta:n=>`총 ${n}건 · 게시물 상세 정보`,video:'게시물 보기 ↗',noVideo:'게시물 링크 없음',noStage:'스테이지 정보 없음',noDate:'일자 정보 없음',info:'상세 정보 보기',close:'닫기'};
function T(){return UI}
function cats(){return CATEGORIES_KR}
const KOREANS=new Set(['퓨츄','싱싱한뉴비','black rabbit','ノノ','sour','푸하하','hmmm','윾띵','프츠','light','인사','포적']);
// 사용자가 확정한 동일인/표기 통합 규칙. 필요하면 여기에 계속 추가 가능.
const ALIASES=new Map([
 ['brack rabbit','black rabbit'],
 ['black rabbit','black rabbit'],
 ['被神眷顾的小初','被神眷顧的小初']
]);
const DISPLAY=new Map([['black rabbit','Black Rabbit'],['sour','기플'],['hmmm','Hmmm']]);
let dataset=[];
let AUTO_STAGE_KR={};
let AUTO_STAGE_KR_CONTEXT={};
async function loadAutoStageKr(){
 try{
  const r=await fetch(`./stage-ko.json?_=${Date.now()}`,{cache:'no-store'});
  if(r.ok){const j=await r.json();AUTO_STAGE_KR=(j&&j.stages)||{};AUTO_STAGE_KR_CONTEXT=(j&&j.context_stages)||{};}
 }catch(e){console.warn('stage-ko.json 로드 실패',e);AUTO_STAGE_KR={};AUTO_STAGE_KR_CONTEXT={};}
}
function normName(raw){
 let s=String(raw??'').trim(); if(!s)return '';
 // 영어 대소문자 통합. 한글/일본어/중국어에는 영향 없음.
 let key=s.toLocaleLowerCase('en-US');
 if(/^noname(?:\b|[\d._-])/i.test(s)||/^deleted\d*$/i.test(s)||s==='不明') return '__unknown__';
 if(ALIASES.has(key)) key=ALIASES.get(key);
 if(ALIASES.has(s)) key=ALIASES.get(s);
 return key;
}
function displayName(key,raw){return DISPLAY.get(key)||raw}
function parseCSV(text){let out=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else{if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v.replace(/\r$/,''));out.push(row);row=[];v=''}else v+=c}}if(v||row.length){row.push(v);out.push(row)}return out}
async function loadTab(tab){
 const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
 const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw new Error(`${tab}: HTTP ${r.status}`);
 const rows=parseCSV(await r.text()); if(!rows.length)return [];
 const headers=rows[0].map(x=>x.trim()); const playerCols=[];
 headers.forEach((h,i)=>{if(h==='プレイヤー')playerCols.push(i)});
 if(!playerCols.length)throw new Error(`${tab}: プレイヤー 열을 찾지 못했습니다.`);
 const koreanCol=headers.findIndex(h=>h==='Korean');
 const findLeft=(start,label)=>{for(let c=start-1;c>=0;c--)if((headers[c]||'').trim()===label)return c;return -1};
 let items=[]; for(let y=1;y<rows.length;y++)for(const x of playerCols){const raw=(rows[y][x]||'').trim();if(raw){
   const stageCol=findLeft(x,'ステージ'); const mapCol=findLeft(stageCol>=0?stageCol:x,'マップ');
   let actualStageCol=stageCol;
   let stage=stageCol>=0?(rows[y][stageCol]||'').trim():'';
   let mapName=mapCol>=0?(rows[y][mapCol]||'').trim():'';

   if(tab==='零レ'){
     actualStageCol=x-9;
     stage=(rows[y][actualStageCol]||'').trim();
     mapName=(rows[y][x-11]||'').trim();
   }

   const urlCol=x-7;
   const url=(rows[y][urlCol]||'').trim();const date=(rows[y][x-1]||'').trim();const stageKr=koreanCol>=0?(rows[y][koreanCol]||'').trim():'';
   items.push({raw,tab,row:y+1,mapName,stage,stageKr,url,date,urlCol:urlCol+1,stageCol:actualStageCol+1})}}
 return items;
}
async function load(){
 await loadWebOverrides();
 await loadAutoStageKr();
 const status=document.querySelector('#status'),err=document.querySelector('#error'); err.style.display='none'; status.textContent=T().loading;
 try{
  const chunks=await Promise.all(Object.keys(CATEGORIES_KR).map(loadTab)); const all=chunks.flat();
  const map=new Map(); let unknown=0;
  for(const item of all){const key=normName(item.raw);if(!key)continue;if(key==='__unknown__'){unknown++;continue}
   if(!map.has(key))map.set(key,{key,name:displayName(key,item.raw),count:0,cats:{},raws:new Set(),posts:[]});
   const p=map.get(key);p.count++;p.cats[item.tab]=(p.cats[item.tab]||0)+1;p.raws.add(item.raw);p.posts.push(item);
  }
  dataset=[...map.values()].sort((a,b)=>b.count-a.count||(Number(isKorean(b))-Number(isKorean(a)))||a.name.localeCompare(b.name));
  window.__unknown=unknown; render();
  status.textContent=T().last+new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'medium'}).format(new Date());
 }catch(e){console.error(e);err.style.display='block';err.innerHTML=`${T().err}<br><b>${String(e.message||e)}</b>`;status.textContent=T().fail;}
}
function isKorean(p){return KOREANS.has(p.key)||KOREANS.has(p.name)}
function render(){
 const q=(document.querySelector('#search').value||'').trim().toLocaleLowerCase();
 let list=q?dataset.filter(p=>p.name.toLocaleLowerCase().includes(q)||[...p.raws].some(x=>x.toLocaleLowerCase().includes(q))):dataset;
 const overallRank=new Map();const firstOfRank=new Set();let prev=null,rank=0;
 dataset.forEach((p,i)=>{if(p.count!==prev){rank=i+1;firstOfRank.add(p.key)}prev=p.count;overallRank.set(p.key,rank)});
 const tbody=document.querySelector('#rows');tbody.innerHTML='';
 list.forEach(p=>{const r=overallRank.get(p.key);const cat=Object.entries(p.cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${cats()[k]} ${v}`).join(' · ');
  const tr=document.createElement('tr');if(isKorean(p))tr.classList.add('kr-row');
  const showRank=q?true:firstOfRank.has(p.key);
  const rankHtml=!showRank?'':r===1?'<span class="medal" title="1위">🥇</span>':r===2?'<span class="medal" title="2위">🥈</span>':r===3?'<span class="medal" title="3위">🥉</span>':String(r);
  tr.innerHTML=`<td class="rank">${rankHtml}</td><td><span class="player"></span><span class="badge-slot"></span><div class="details"></div></td><td class="count"><button class="info-btn" type="button" aria-label="${T().info}" title="${T().info}">i</button>${p.count}</td>`;
  const playerEl=tr.querySelector('.player');playerEl.textContent=p.name;if(isKorean(p)){const badge=document.createElement('span');badge.className='kr-badge';badge.textContent='KR';tr.querySelector('.badge-slot').appendChild(badge)}playerEl.addEventListener('click',()=>openPlayer(p));tr.querySelector('.info-btn').addEventListener('click',()=>openPlayer(p));tr.querySelector('.details').textContent=cat;tbody.appendChild(tr)
 });
 document.querySelector('#unknownBottom').textContent=(window.__unknown||0).toLocaleString()+'건';
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const STAGE_KR_EXACT={
 // 한국어 자료와 대조해 확인한 스페셜 스테이지명. 레전드 계열은 시트의 Korean 열을 우선 사용한다.
 '新約・ネコ補完計画 極ムズ':'새로운 고양이 보충 계획 극난도',
 '世界の中心でアイを叫んだネコ 超極ムズ':'세상의 중심에서 사랑을 외치는 고양이 초극난도',
 '修羅の道 極ムズ':'아수라의 길 극난도',
 '阿・修羅の道 極ムズ':'계속되는 아수라의 길 극난도',
 '羅刹街道 超極ムズ':'악마의 도로 초극난도',
 'ハニートラップ 極ムズ':'허니 트랩 극난도',
 '天災の七光り 超極ムズ':'무지개빛 천재지변 초극난도'
}
function fallbackStageKr(tab,mapName,stage){
 // v5: 카테고리+맵+스테이지 문맥을 가장 먼저 사용한다. 검증되지 않은 이름은 임의 번역하지 않는다.
 if(!stage)return '';
 const full=`${tab||''}|${mapName||''}|${stage}`;
 const mapKey=`${mapName||''}|${stage}`;
 return AUTO_STAGE_KR_CONTEXT[full]||AUTO_STAGE_KR_CONTEXT[mapKey]||AUTO_STAGE_KR[stage]||STAGE_KR_EXACT[stage]||'';
}

function openPlayer(p){
 const modal=document.querySelector('#playerModal');document.querySelector('#modalTitle').textContent=p.name;document.querySelector('#modalMeta').textContent=T().meta(p.count);
 const posts=[...p.posts].sort((a,b)=>{const da=parseDate(a.date),db=parseDate(b.date);return db-da||a.tab.localeCompare(b.tab)});
 document.querySelector('#postList').innerHTML=posts.map(raw=>{const x=applyWebOverride(raw);const rawUrl=String(x.url||'').trim();const valid=!!rawUrl;const postUrl=/^\/\//.test(rawUrl)?'https:'+rawUrl:rawUrl;const stage=String(x.stage||'').trim();
const date=x.date||T().noDate;
const translated=stage ? (x.stageKr||fallbackStageKr(x.tab,x.mapName,stage)) : '';
const title=translated||stage||T().noStage;return `<article class="post"><div class="post-top"><div class="post-stage">${esc(title)}</div><span class="post-cat">${esc(cats()[x.tab]||x.tab)}</span></div><div class="post-bottom"><span>${esc(date)}</span>${valid?`<a class="post-link" href="${esc(postUrl)}" target="_blank" rel="noopener noreferrer">${T().video}</a>`:`<span class="post-link disabled">${T().noVideo}</span>`}</div>${ADMIN_MODE?`<div class="admin-tools"><input class="admin-stage" value="${esc(stage)}" placeholder="스테이지 이름"><input class="admin-url" value="${esc(rawUrl)}" placeholder="게시물 링크"><div class="admin-actions"><button type="button" class="admin-save">변경 저장</button><button type="button" class="admin-delete">링크 삭제</button></div><div class="admin-msg"></div></div>`:''}</article>`}).join('');
 if(ADMIN_MODE){
  [...document.querySelectorAll('#postList .post')].forEach((el,i)=>{
   const x=applyWebOverride(posts[i]);
   el.querySelector('.admin-save')?.addEventListener('click',e=>adminSave(e.currentTarget,x));
   el.querySelector('.admin-delete')?.addEventListener('click',e=>adminDeleteLink(e.currentTarget,x));
  });
 }
 modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
}
function parseDate(s){const m=String(s||'').match(/^(\d{2})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return 0;return new Date(2000+Number(m[1]),Number(m[2])-1,Number(m[3])).getTime()}
function closePlayer(){const m=document.querySelector('#playerModal');m.classList.remove('open');m.setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.querySelector('#modalClose').addEventListener('click',closePlayer);document.querySelector('#playerModal').addEventListener('click',e=>{if(e.target.id==='playerModal')closePlayer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer()});
document.querySelector('#search').addEventListener('input',render);
document.querySelector('#refresh').onclick=load;
load(); setInterval(load,60000);
</script>
